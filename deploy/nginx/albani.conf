# nginx do host: site estático + CMS no mesmo domínio (painel em /admin -> /cms/admin/).
# Copie para /etc/nginx/sites-available/albani.conf, crie o link em sites-enabled,
# rode `nginx -t && systemctl reload nginx` e depois o certbot (ele adiciona o bloco 443):
#   certbot --nginx -d albaniadv.com -d www.albaniadv.com
# Ao trocar de domínio, mude os server_name (e VITE_SITE_URL/CMS_PUBLIC_URL no .env).

# www -> domínio sem www (uma única URL canônica)
server {
    listen 80;
    listen [::]:80;
    server_name www.albaniadv.com;
    return 301 $scheme://albaniadv.com$request_uri;
}

# Site (gerado pelo builder em /var/www/albani/releases/<ts>, publicado via symlink "current")
server {
    listen 80;
    listen [::]:80;
    server_name albaniadv.com;

    root /var/www/albani/current;
    index index.html;

    # vite-ssg com dirStyle 'flat': /sobre -> sobre.html, /en -> en.html
    location / {
        # Uma URL só por página: sem barra final (/blog/ daria 403, /sobre/ daria 404) e sem /index.html.
        # Usa $request_uri porque o error_page 404 reaproveita /index.html internamente.
        rewrite ^/(.+)/$ /$1 permanent;
        if ($request_uri ~ ^/index\.html) {
            return 301 /;
        }
        try_files $uri $uri.html $uri/ =404;
        # O HTML muda a cada publicação no CMS: o navegador sempre confere com o servidor
        # (responde 304 se nada mudou). Sem isto ele pode mostrar a versão antiga por minutos.
        add_header Cache-Control "no-cache";
    }

    # Arquivos com hash no nome: cache longo
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /img/ {
        try_files $uri =404;
        expires 30d;
    }

    # Não há 404.html pré-renderizado: a home responde com status 404 e o
    # roteador do Vue mostra a página "não encontrada" no cliente.
    # (Não afeta o /cms/: respostas do proxy só passam por aqui com proxy_intercept_errors.)
    error_page 404 /index.html;

    # charset: llms.txt, robots.txt e sitemap.xml com acentos corretos
    charset utf-8;
    charset_types text/plain text/xml application/xml;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Atalho para o painel
    location ~ ^/admin/?$ {
        absolute_redirect off;
        return 302 /cms/admin/;
    }

    # CMS (Directus no Docker, porta só em 127.0.0.1), servido no subcaminho /cms/.
    # Precisa de CMS_PUBLIC_URL=https://<domínio>/cms no deploy/.env.
    location /cms/ {
        client_max_body_size 20m;
        proxy_pass http://127.0.0.1:8055/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
