# nginx do host: site estático + proxy do CMS.
# Copie para /etc/nginx/sites-available/albani.conf, crie o link em sites-enabled,
# rode `nginx -t && systemctl reload nginx` e depois o certbot (ele adiciona o bloco 443):
#   certbot --nginx -d albaniadv.com -d www.albaniadv.com -d cms.albaniadv.com

# Site (gerado pelo builder em /var/www/albani/releases/<ts>, publicado via symlink "current")
server {
    listen 80;
    listen [::]:80;
    server_name albaniadv.com www.albaniadv.com;

    root /var/www/albani/current;
    index index.html;

    # vite-ssg com dirStyle 'flat': /sobre -> sobre.html, /en -> en.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Arquivos com hash no nome: cache longo
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /img/ {
        try_files $uri =404;
        expires 30d;
    }

    # Não há 404.html pré-renderizado: a home responde com status 404 e o
    # roteador do Vue mostra a página "não encontrada" no cliente.
    error_page 404 /index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;
}

# CMS (Directus no Docker, porta só em 127.0.0.1)
server {
    listen 80;
    listen [::]:80;
    server_name cms.albaniadv.com;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8055;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
